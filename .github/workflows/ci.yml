# GitHub Actions — the mirror pipeline.
#
# Implementation Rule 4 (brief p.8) says "Add GitHub Actions workflows that run on every
# PR and commit: build, lint, type-check, test, coverage, dependency audit (pnpm audit),
# and security scan" plus a source-code inventory. This file is that, literally.
#
# The submission target on p.10 is a GitLab repository, and this fork's `origin` is
# GitLab, so .gitlab-ci.yml is the pipeline that actually blocks merges. Rather than
# picking one platform and documenting a deviation, both exist and run the same eight
# checks — this repo has both remotes configured. Keep the two in sync; .gitlab-ci.yml
# is authoritative if they ever drift.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10.27.0'
  NODE_VERSION: '22'

jobs:
  # Rule 5: compile once, then hand the output to every downstream job as an artifact
  # tagged with the commit SHA. Nothing recompiles.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # --frozen-lockfile turns lockfile drift into a failure. Rule 4 requires pinned
      # versions and a committed lockfile; this is what enforces it.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - run: pnpm build
      - run: echo "${{ github.sha }}" > dist-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ship-dist-${{ github.sha }}
          retention-days: 7
          path: |
            shared/dist/
            agent/dist/
            api/dist/
            web/dist/
            sdk/dist/
            dist-sha.txt

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Zero errors is the gate. Warnings are debt owned by named improvement lanes, so
      # --max-warnings is intentionally unset for now.
      - run: pnpm lint
      - run: pnpm exec eslint . --format stylish > eslint-report.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: eslint-report.txt

  # PF-013 — the public/internal boundary, enforced by the pipeline rather than by
  # review. Blocking, and deliberately placed with the other text-only checks so it
  # reports in under a minute: a boundary violation is a design error, and the
  # cheapest moment to see it is before the 80-minute e2e job has started.
  #
  # No `needs: build`. This reads source text through ESLint; it does not want a
  # compiled tree, and coupling it to the build would delay the fastest signal in
  # the pipeline behind the slowest job in it.
  #
  # `pnpm lint` proves the tree has no violations today. `pnpm lint:boundary`
  # proves the rules that would catch one are still wired up — see
  # scripts/check-boundary-lint.mjs for why those are different claims.
  boundary-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Boundary fences fire on their negative fixtures
        run: pnpm lint:boundary

  # PF-717 — the WORKSPACE DEPENDENCY RULE, and it is deliberately its own job
  # that runs BEFORE lint rather than a step inside it.
  #
  # PRD p.11 names a workspace dependency rule; p.18 names the lint rule. They
  # catch different things and neither subsumes the other: ESLint sees import
  # specifiers, so it cannot see a dependency that has been declared, installed
  # and hoisted before anybody writes an `import` — or one reached through
  # `require()` or a computed dynamic import. Ordering matters for the reader as
  # much as for the machine: a red job named "workspace dependency rule" says
  # what went wrong; a lint failure twenty steps into a matrix does not.
  #
  # PF-722 rides along because it is the runtime twin of the same claim — the
  # import fence stops compile-time cheating, the credential scan stops the
  # runtime kind.
  integration-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PF-716/717 — integrations declare @ship/sdk and nothing else of ours
        run: pnpm check:integration-deps
      - name: PF-722 — no integration holds a privileged credential
        run: pnpm check:integration-credentials

  # PF-720 — one blocking job per integration package, each behind the
  # zero-tests-ran guard.
  #
  # The guard is the point. Deleting every test from a package makes vitest exit
  # 0 with "no test files found", which reads as a pass in a job list; the
  # minimum count turns that into exit 2, which `assert-tests-ran.sh` documents
  # as VOID rather than as a failure. This repo already applies it to the agent
  # and E2E suites for exactly that reason.
  #
  # Only the suites that need NO booted Ship run here. The server-backed drills
  # (`pnpm drill:refresh`, `pnpm drill:idempotency`) and the Slack listener's
  # end-to-end suite have their own jobs further down, because they need a
  # database service and a built api/dist.
  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `minimum` comes from a known-good local run, per assert-tests-ran's
          # own guidance. Raise it when a package grows tests; never lower it to
          # make a red job green.
          - package: '@ship/integration-testkit'
            minimum: 11
          - package: '@ship/cli'
            minimum: 21
          - package: '@ship/browser-demo'
            minimum: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # F47 — nothing under integrations/ resolves until the SDK is built, and
      # every lane has hit this independently.
      - run: pnpm build:shared && pnpm --filter @ship/sdk build
      - name: ${{ matrix.package }} — suite, behind the zero-tests-ran guard
        run: scripts/assert-tests-ran.sh ${{ matrix.minimum }} -- pnpm --filter ${{ matrix.package }} test

  type-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `needs: build` orders the jobs; it does not carry a filesystem between them.
      # api/ and web/ import @ship/shared, which resolves to shared/dist/index.d.ts, so
      # without this tsc reports TS2307 "Cannot find module '@ship/shared'" on ~40 files.
      #
      # `pnpm build:shared` was enough until agent/ joined the workspace. `pnpm
      # type-check` is `--recursive`, so it now compiles @ship/agent too, and
      # agent/src/actions/client.ts imports the circuit breaker from `api/dist` on
      # purpose (agent compiles with rootDir: ./src, so a .ts import outside it is a
      # hard tsc error while the built .d.ts is not). Without api/dist that import is
      # TS2307 and this job fails on a file nobody touched.
      #
      # Downloading the artifact rather than rebuilding is Rule 5, and it is what
      # .gitlab-ci.yml already does — `needs: ['build']` there carries shared/dist/ and
      # api/dist/ into the job.
      - uses: actions/download-artifact@v4
        with:
          name: ship-dist-${{ github.sha }}
      - run: pnpm type-check

  # L13 PF-369 / PF-377 — the committed public spec cannot go stale, and drift FAILS.
  #
  # Mirrors the `openapi-freshness` job in .gitlab-ci.yml, which is authoritative.
  # `docs/openapi.json` is a Submission Requirement (p.13) and is generated, so it can
  # silently fall behind: add an endpoint, forget to regenerate, and the artifact ships
  # describing an API that no longer exists.
  #
  # Decision (PF-377): fail, not warn, and no additive carve-out. "It's only additive"
  # is how every drift starts. The spec↔route parity half runs inside the `test` job
  # as platform/openapi/specParity.test.ts, so it gates the same required check as
  # everything else.
  openapi-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi:public
      - name: docs/openapi.json is up to date
        run: |
          git diff --exit-code docs/openapi.json || {
            echo ''
            echo 'docs/openapi.json is STALE — the committed public spec does not match'
            echo 'the routes on this branch. Fix it with:'
            echo ''
            echo '    pnpm openapi:public && git add docs/openapi.json'
            echo ''
            echo 'Do not hand-edit the file: it is generated from the declareV1Route()'
            echo 'calls beside the handlers (PRD p.11).'
            exit 1
          }

  # `pnpm type-check` proves the code compiles. It does not observe how much of that
  # compilation was bought with `any`, `as` and `!` — which is what Category 1 is measured
  # on, and which has already regressed here unnoticed while every other check was green.
  # No `needs: build`: this reads source text and does not want a compiled tree.
  type-violations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-type-violations.sh

  # Also text-only, and deliberately in CI rather than only in deploy.yml's preflight:
  # the failure it guards against is invisible until an apply runs, and by then the
  # credential is already gone from a live service. Catching it on the PR that adds the
  # variable is the only cheap moment.
  tf-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-tf-secrets.sh

  # The only check here that leaves the machine. Every other job can be wrong about the
  # outside world and still pass: `SUBMISSION.md` named a Render service that had been
  # deleted, and the build, the types, the tests and the Terraform checks were all green
  # across the entire window in which the first link in the submission returned 404.
  # A timeout warns rather than fails, so this cannot go red on a bad network day.
  doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-doc-links.sh

  # L26 PF-804 — MVP gate item 9's enforcement half. Mirrors `regression-budget` in
  # .gitlab-ci.yml, which is the authoritative pipeline.
  #
  # PRD p.2 item 9: "Existing Playwright regression suite passes on main; P95 latency,
  # bundle size, and per-route query counts within +10% of the Part 1 baseline." p.6
  # restates the budget. p.18's Pre-Search question asks how it will be enforced —
  # "manual benchmark, automated baseline comparison, perf job that fails the PR?" —
  # and this job is the third answer. `compare-baseline.ts` exits non-zero over budget,
  # so there is no output to parse and no way to be over budget and green.
  #
  # ── Why latency is advisory here and enforced elsewhere ────────────────────────
  # Bundle bytes and query counts are deterministic: same tree, same numbers, any
  # machine. An in-process P95 is not. The baseline was captured on darwin-arm64 /
  # node v26 / 10 cores; this runner is linux-x64 / node 22 / 2-4 shared cores.
  # Comparing those measures the runner, in BOTH directions — it can hide a real
  # regression behind a faster box as easily as invent one on a slower box, and a perf
  # job that goes red for reasons unrelated to the diff gets disabled within a week.
  # So the comparator reads the baseline's environment fingerprint, marks latency
  # advisory when it does not match, and keeps the two deterministic metrics enforced.
  # The latency half is enforced on a machine matching the baseline and recorded in
  # docs/mvp-gate-item-9.md. A deliberate split, not a gap: the report names it in the
  # artifact every run.
  regression-budget:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ship_test
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ship:ship_test_password@localhost:5432/ship_test
      SESSION_SECRET: ci-only-not-a-real-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # F47 — a clean checkout does not resolve @ship/shared or @ship/agent until these
      # have run, and `createApp()` (which the comparator drives) imports both.
      - run: pnpm build:agent
      # The bundle figure is measured off web/dist. PF-802 rejects a comparison with no
      # bundle number rather than skipping that third of the gate, so this is required,
      # not an optimisation.
      - run: pnpm build:web
      - run: pnpm --filter @ship/api exec tsx src/db/migrate.ts
      - run: pnpm baseline:compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report-${{ github.sha }}
          retention-days: 7
          path: |
            docs/regression-report.md
            docs/regression-report.json

  test:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ship_test
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # api/src/test/setup.ts truncates 15 tables in a beforeAll against whatever
      # DATABASE_URL resolves to. Point it at the throwaway service container
      # explicitly — never let it inherit a real database URL.
      DATABASE_URL: postgresql://ship:ship_test_password@localhost:5432/ship_test
      SESSION_SECRET: ci-only-not-a-real-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:agent   # shared -> agent; api imports @ship/agent
      # L17 PF-492 — the MVP gate item 8 test lives in @ship/api (ESLint fence 4
      # forbids sdk/ importing anything in this repo, so the SDK cannot boot the
      # server) and it imports `@ship/sdk` through the package's `exports` map.
      # That resolves to `dist`, so the SDK must be BUILT before the api suite
      # runs — otherwise the gate test fails on a missing module and looks like a
      # broken import rather than a missing build.
      - run: pnpm --filter @ship/sdk build
      - run: pnpm --filter @ship/api exec tsx src/db/migrate.ts
      # L18 PF-532 — TESTING SCENARIO 5's second half, as its own BLOCKING step.
      #
      # p.4 requires spec↔SDK drift to fail CI; p.6 sets spec parity at 100%.
      # The full api suite below already runs this file, so this step adds no
      # coverage — it adds a NAME. A parity break inside a 1900-test run is one
      # red line in a wall of output attributed to "api tests"; here it is a
      # step called "spec ↔ SDK parity" that failed, which is the difference
      # between a five-minute diagnosis and a fifty-minute one.
      #
      # It is also the step that cannot be lost to a `--filter` change: the
      # walk's own §1 refuses to run against zero operations or an empty
      # binding table, so this step cannot go green by checking nothing.
      - name: Testing Scenario 5 — spec ↔ SDK surface parity (PF-528..532)
        run: pnpm --filter @ship/api exec vitest run src/platform/openapi/sdkSurfaceParity.test.ts
      # Both suites. `pnpm test` alone is api-only and would leave 151 web tests
      # unexecuted, which does not satisfy Rule 2.
      - run: pnpm --filter @ship/api exec vitest run --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - run: pnpm --filter @ship/web exec vitest run --reporter=default --reporter=junit --outputFile.junit=junit.xml
      # F24 — @ship/sdk had no CI step of any kind, which made it the one package a
      # stranger installs and the only one nothing verified. L17 filled it with a
      # real suite, so `--passWithNoTests` is now belt-and-braces rather than the
      # reason the step passes.
      - run: pnpm --filter @ship/sdk test
      # L17 PF-514/PF-515 — the p.9 install budget, ENFORCED.
      #
      # Pre-Search 1.2 (p.15) asks "how will you enforce it (bundle analyzer, CI
      # size check)". This is the size-check answer, chosen because an analyzer
      # REPORTS and a check REFUSES — and only a refusal stops a 400 KB
      # dependency landing on a Friday. `--check` exits non-zero over budget or
      # when a declared dependency cannot be measured.
      #
      # Runs after the build above, because it measures `dist` plus the
      # production dependency closure, not the source.
      - run: pnpm --filter @ship/sdk size:check
      # L18 PF-547 — p.8's Signature Challenge target, MEASURED.
      #
      # Same shape and the same reason as `size:check`: the ticket is satisfied
      # by a recorded figure, and a figure over budget is a failure with a name
      # rather than a rounding conversation. `--check` exits non-zero over the
      # 1 ms p95 target and refuses outright if `dist` was never built.
      - run: pnpm --filter @ship/sdk perf:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Both SDK budget numbers under ONE artifact, so the submission has one
          # place to look (PF-547).
          name: sdk-budget-reports
          path: |
            sdk/size-report.json
            sdk/perf-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: |
            api/junit.xml
            web/junit.xml

  # FG-247 / FG-248 / FG-235 — the agent package's own gate.
  #
  # Separate from `test` rather than a third line inside it, for one reason: the
  # agent suite provisions its OWN Postgres per test file with testcontainers and does
  # not use DATABASE_URL at all. Adding it to `test` would run it inside a job whose
  # env points at a service container it ignores, and the next person to read the job
  # would reasonably assume the service was what it was talking to.
  #
  # `ubuntu-latest` has a Docker daemon, which is what testcontainers needs. 11 of the
  # 19 agent spec files start a `postgres:16` container; the other 8 are pure and would
  # pass anywhere. Running the whole suite here means the gate covers both.
  #
  # The regression tests FG-229 through FG-234 live in this suite —
  # agent/src/graph/use-cases.test.ts and agent/src/actions/autonomy.test.ts — so this
  # job is what makes "all of them run in CI" true rather than aspirational.
  #
  # assert-tests-ran.sh is not decoration. A vitest path typo or a crashed worker exits
  # 0 having run nothing, and 162 green tests and 0 executed tests look identical in a
  # summary line. The expected minimum is the whole suite, taken from a known-good run.
  # Raise it when tests are added; a SHORT RUN exits 2, which is distinct from a test
  # failure on purpose.
  agent-test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Rule 5: the compiled tree comes from `build`, it is not rebuilt here.
      # agent/src/actions/client.ts imports the circuit breaker from api/dist —
      # deliberately, so the agent reuses api/src/services/circuitBreaker.ts rather than
      # growing a second one (engineering requirement 4). Without api/dist the whole
      # actions layer fails to resolve.
      - uses: actions/download-artifact@v4
        with:
          name: ship-dist-${{ github.sha }}

      # Pre-pull so a slow registry does not eat the per-container start timeout inside
      # the first `beforeAll`. Failing here says "the image could not be fetched", which
      # is a much better error than a hook timeout 180 seconds later.
      - run: docker pull postgres:16

      - name: Agent suite
        run: scripts/assert-tests-ran.sh 162 -- pnpm --filter @ship/agent exec vitest run --reporter=default --reporter=junit --outputFile.junit=junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results-agent
          path: agent/junit.xml

  coverage:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ship_test
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ship:ship_test_password@localhost:5432/ship_test
      SESSION_SECRET: ci-only-not-a-real-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:agent   # shared -> agent; api imports @ship/agent
      # Same reason as the `test` job: `sdkGate.test.ts` imports @ship/sdk
      # through its exports map, which resolves to dist (L17 PF-492).
      - run: pnpm --filter @ship/sdk build
      - run: pnpm --filter @ship/api exec tsx src/db/migrate.ts
      - run: pnpm --filter @ship/api test:coverage
      # web needs --coverage.reportOnFailure explicitly; vitest defaults it to false,
      # so a failing run would otherwise produce no coverage report at all.
      - run: pnpm --filter @ship/web test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            api/coverage/
            web/coverage/

  # E2E is a blocking gate, not an advisory one.
  #
  # It was previously local-only, which meant the 874 Playwright tests never ran
  # against a merge. Everything the unit suites cannot see — the 4-panel layout, the
  # collaboration socket, session expiry, the editor — was unguarded on every merge to
  # main. Two real bugs reached main that way and were caught by hand afterwards.
  #
  # It uses a `postgres` service rather than testcontainers, matching .gitlab-ci.yml.
  # `ubuntu-latest` does have a Docker daemon, so testcontainers would work here — but
  # the GitLab runner this project actually has sets `privileged = false`, so relying on
  # a daemon would make the gate real on one platform and impossible on the other.
  # `E2E_DATABASE_URL` switches e2e/fixtures/isolated-env.ts onto a database-per-worker
  # on the service. Isolation is unchanged; it is unset locally, so a developer's run
  # still uses testcontainers.
  #
  # PLAYWRIGHT_WORKERS is pinned. playwright.config.ts otherwise derives the count from
  # free memory at launch, which on one machine produced a 1-worker run and a 10-worker
  # run of the same tree within an hour — the second leaving 47 tests unexecuted. A gate
  # whose parallelism depends on how much RAM the runner happens to have free is not a
  # gate you can compare two commits with.
  #
  # `retries: 2` comes from the config's CI branch and is deliberate: it lets a known
  # timing flake pass while still failing anything deterministic, because a deterministic
  # failure fails all three attempts. The untried flake rate is measured separately at
  # --retries=0 and reported in SUBMISSION.md rather than hidden by this setting.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ship_test
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Connects to the `postgres` database, not `ship_test`: the fixture needs somewhere
      # to issue CREATE DATABASE from, and POSTGRES_USER is the image's superuser.
      E2E_DATABASE_URL: postgresql://ship:ship_test_password@localhost:5432/postgres
      # 2. Tried at 3, measured, and put back — the runner has the memory for 3 and it
      # still does not help.
      #
      # Each worker runs an API server, a Vite preview and a Chromium. Four of each was
      # killed by the OOM reaper at test 510 of 874, which is where the pin to 2 came
      # from, and that measurement was taken in a 7.8 GB container. The runner is now
      # 15.6 GB — this repository is public, and GitHub gives public repositories the
      # larger `ubuntu-latest` — so the memory half of the original argument no longer
      # holds, and 3 looked safe.
      #
      # Same branch, same 877 tests, two consecutive runs:
      #
      #                    2 workers (dc36a77)   3 workers (f733527)
      #   wall clock              18.5 min             15.1 min
      #   passed                       869                  817
      #   failed                         4                    4
      #   flaky                          4                   10
      #   DID NOT RUN                    0                   46
      #
      # 3.4 minutes faster, and it loses 46 tests. There is no `maxFailures` in
      # playwright.config.ts, so tests that never ran mean a worker process went away
      # and took its queue with it. `assert-tests-ran` catches that and voids the run,
      # which is the whole reason that gate exists: a subset that happens to be green
      # tells you nothing about the rest.
      #
      # So memory was never the binding constraint — CPU is, and that is the half of
      # the argument the 3-worker attempt explicitly did not re-measure. Doubling the
      # flake rate is the visible symptom of the same oversubscription.
      #
      # Do not raise this again without a bigger runner. The lever that would actually
      # work is `runs-on: ubuntu-latest-4-core` or larger, not a higher worker count on
      # the same two.
      PLAYWRIGHT_WORKERS: '2'
      SESSION_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # The expected minimum is the whole suite. A filter or a crashed worker that
      # silently drops tests exits 2 here instead of reading as a pass — the failure
      # mode that produced two "clean" 827-test runs during this work.
      - name: E2E suite
        run: scripts/assert-tests-ran.sh 874 -- pnpm exec playwright test --reporter=line

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gate: zero critical. Was 3 before the pnpm.overrides in package.json pinned
      # fast-xml-parser >=5.3.5, protobufjs >=7.5.5, vitest >=4.1.0.
      - run: pnpm audit --audit-level critical
      # High and moderate are reported, not gated — justification in CHANGES.md. The
      # summary script flags anything absent from audit-baseline.json so a genuinely new
      # advisory is still visible.
      - run: pnpm audit --json > pnpm-audit.json || true
      - run: node scripts/audit-summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: |
            pnpm-audit.json
            audit-summary.md

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # `comply` is the organisation's scanner but is not available in this runner, so
      # gitleaks stands in. The substitution is recorded in CHANGES.md.
      #
      # GITHUB_TOKEN is required, not optional, and only on `pull_request` events —
      # the action resolves the PR's commit range through the API. Without it the job
      # fails in 10 seconds with "GITHUB_TOKEN is now required to scan pull requests".
      #
      # That asymmetry is why this went unnoticed: the push-event run of the same
      # commit passes this job, so the branch looked green from `gh run list` while
      # every PR run had a red security-scan. It is the automatically-provided token,
      # so nothing needs configuring in repository settings.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'

  license-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Rule 4: "a list of all packages, their versions, and their license."
      - run: pnpm licenses list --json > licenses.json
      - run: node scripts/license-inventory.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: source-code-inventory
          path: |
            licenses.md
            licenses.csv
            licenses.json

  # Rule 5: one image, tagged with the commit SHA, promoted rather than rebuilt.
  #
  # This job is the publisher. It produces THE artifact — the one Render runs —
  # and pushes it to ghcr.io. Nothing downstream rebuilds it; terraform/render
  # points `runtime_source.image` at the tag this job pushes. Full lifecycle in
  # docs/artifact-lifecycle.md.
  #
  # Why ghcr.io and not the GitLab registry, given that .gitlab-ci.yml is the
  # pipeline that gates merges: the GitLab instance does not run a registry.
  # `labs.gauntletai.com/jwt/auth?service=container_registry` answers
  # `{"code":"UNAVAILABLE","message":"registry not enabled"}` (HTTP 404), the
  # project's `container_registry_image_prefix` is null, and its registry
  # repository list is empty. `$CI_REGISTRY_IMAGE` therefore expands to the empty
  # string in a job, which is what made `docker build -t ":$CI_COMMIT_SHA"` fail
  # with `invalid reference format` on five consecutive main pipelines. There is
  # no credential that fixes that — the service is not deployed. ghcr.io is
  # reachable and is backed by the GitHub remote this repo already has.
  #
  # Credential: none to provision. GITHUB_TOKEN with `packages: write` is issued
  # to the job by Actions itself, which is the whole reason to publish from this
  # side rather than pushing to ghcr.io from GitLab with a long-lived PAT.
  # `agent-test` is in `needs` for the reason FG-236 exists: the image this job
  # publishes is the only thing that can be deployed, so a failing regression test
  # must stop the artifact from existing rather than be caught after it is live.
  # Blocking promotion is the cheap half of "a failing build never stays deployed";
  # .github/workflows/deploy.yml is the other half.
  docker-image:
    runs-on: ubuntu-latest
    needs: [build, lint, type-check, test, agent-test]

    # Least privilege, and not the default. Without `packages: write` the token
    # can read ghcr.io but not push; `contents: read` is all the rest of the job
    # needs. Declaring the block at all drops every other scope to none.
    permissions:
      contents: read
      packages: write

    env:
      # ghcr.io requires a lowercase path. `joshdrochon/ship` already is, so
      # ${{ github.repository }} is used directly rather than lowercased at
      # runtime — if the repo is ever renamed to something with capitals, the
      # push fails loudly here rather than pushing to a surprising path.
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build once, into the local daemon, so the next step can inspect and run
      # the exact image that will be pushed. `load: true` and `push: true` are
      # mutually exclusive in buildx, and verifying-then-pushing the same local
      # image is worth more than saving a layer export: a push of an image whose
      # provenance was never checked is how the SHA silently stops propagating.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The provenance gate. Rule 5 says "tag each artifact with the git commit
      # SHA" — this proves the SHA actually reached the image, rather than
      # trusting that a --build-arg was wired correctly. It is the check that
      # would have caught the whole finding.
      - name: Verify the image carries this commit SHA
        run: |
          set -euo pipefail
          expected='${{ github.sha }}'

          label=$(docker inspect --format \
            '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$IMAGE:$expected")
          echo "label org.opencontainers.image.revision = $label"
          [ "$label" = "$expected" ] || {
            echo "::error::image label is '$label', expected '$expected'"
            exit 1
          }

          env_sha=$(docker inspect --format \
            '{{ range .Config.Env }}{{ println . }}{{ end }}' \
            "$IMAGE:$expected" | sed -n 's/^GIT_SHA=//p')
          echo "runtime env GIT_SHA = $env_sha"
          [ "$env_sha" = "$expected" ] || {
            echo "::error::runtime GIT_SHA is '$env_sha', expected '$expected'"
            exit 1
          }

      # And that the value reaches the wire, not just the image metadata. The
      # container's default CMD runs migrate and seed against a database that
      # does not exist here, so start the server directly — /health is served by
      # api/src/app.ts before any query is issued, so no database is needed to
      # answer it. DATABASE_URL and SESSION_SECRET are throwaway values that only
      # have to satisfy the boot-time checks.
      #
      # Requested via `docker exec` from inside the container rather than through
      # a published port, matching .gitlab-ci.yml. It is not needed here — this
      # runner has a local daemon — but keeping the two identical means the check
      # cannot pass on one platform and fail on the other, and the docker-in-
      # docker case genuinely breaks with a published port. node:20-slim ships
      # neither curl nor wget; it does ship node, which has a global fetch.
      - name: Verify /health reports the SHA
        run: |
          set -euo pipefail
          docker run -d --name ship-provenance \
            -e SESSION_SECRET=ci-only-not-a-real-secret \
            -e DATABASE_URL=postgres://unused:unused@127.0.0.1:5432/unused \
            "$IMAGE:${{ github.sha }}" node dist/index.js

          health=""
          for _ in $(seq 1 30); do
            if health=$(docker exec ship-provenance node -e \
                 "fetch('http://127.0.0.1:80/health').then(r=>r.text()).then(t=>process.stdout.write(t))" 2>/dev/null); then
              break
            fi
            sleep 2
          done

          docker logs ship-provenance || true
          echo "GET /health -> $health"
          echo "$health" | grep -q "\"revision\":\"${{ github.sha }}\"" || {
            echo "::error::/health did not report ${{ github.sha }}"
            exit 1
          }
          docker rm -f ship-provenance

      # Fork pull requests get a read-only GITHUB_TOKEN, so a push from one
      # cannot succeed — it is not a policy choice. Everything above still runs
      # on a PR, so the artifact is built and its provenance verified on every
      # commit; only the publish waits for the branch push. There is no
      # "credentials missing, skipping" path left: when this step runs, it pushes
      # or it fails the pipeline.
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ env.IMAGE }}:${{ github.sha }}
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          docker push "$IMAGE:${{ github.sha }}"
          echo "pushed $IMAGE:${{ github.sha }}"

      # `latest` is a convenience pointer for humans, never a deploy target —
      # terraform/render takes an explicit SHA (var.image_tag) precisely so that
      # what is deployed cannot change because someone moved a floating tag.
      # Only the default branch moves it.
      - name: Move :latest (default branch only)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:latest"

      - name: Summary
        if: github.event_name == 'push'
        run: |
          {
            echo "### Artifact published"
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| Image | \`$IMAGE:${{ github.sha }}\` |"
            echo "| Revision | \`${{ github.sha }}\` |"
            echo
            echo 'Deploy it:'
            echo '```'
            echo "cd terraform/render && terraform apply -var image_tag=${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
