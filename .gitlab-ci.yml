# GitLab CI — the primary pipeline.
#
# Implementation Rule 4 (brief p.8) requires build, lint, type-check, test, coverage,
# dependency audit (pnpm audit), security scan, and a source-code inventory, running on
# every commit and merge request, all passing before a merge.
#
# Rule 4 names GitHub Actions; the submission target on p.10 is a GitLab repository, and
# this fork's `origin` is GitLab. Both are satisfied rather than one being traded away:
# this file is the gate that actually blocks merges, and .github/workflows/ci.yml mirrors
# the same eight checks so the rule is met literally on the platform it names. If the two
# ever disagree, this file wins — it is the one attached to the submitted repository.
#
# Rule 5 (build/release/run separation) is why `build` runs once, early, and every later
# job consumes its artifact instead of recompiling. The artifact carries the commit SHA.

# One pipeline per commit, and it is the branch pipeline.
#
# Without this, opening a merge request creates a second, *merge request* pipeline
# alongside the branch one. Every job in this file uses the default `only:
# [branches, tags]`, which does not match `merge_request_event` — so that second
# pipeline is created with zero jobs, and GitLab marks a jobless pipeline as failed.
# Observed directly: MR !1's head pipeline (17395) failed with no jobs while the branch
# pipeline for the identical SHA (17387) was green on all eight.
#
# That matters beyond tidiness because `only_allow_merge_if_pipeline_succeeds` gates on
# the MR's head pipeline. A phantom failure would have blocked every merge in the project
# while the real checks passed.
#
# Two ways to fix it: give all eight jobs `rules` that match merge_request_event, or stop
# creating the duplicate. The second is chosen — the branch pipeline already runs every
# check against the exact SHA being merged, so an MR pipeline would re-run identical work
# for no additional signal, and Rule 5 (build once, promote) argues against duplicating a
# build per pipeline source.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - setup
  - verify
  - audit
  - package

default:
  image: node:22-bookworm
  interruptible: true
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.27.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    # Keyed on the lockfile so a dependency change invalidates it and nothing else does.
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

variables:
  # Rule 4 also requires pinned dependencies and a committed lockfile. --frozen-lockfile
  # above turns a drifted lockfile into a pipeline failure rather than a silent install.
  PNPM_VERSION: '10.27.0'
  POSTGRES_DB: ship_test
  POSTGRES_USER: ship
  POSTGRES_PASSWORD: ship_test_password
  # api/src/test/setup.ts truncates 15 tables in a beforeAll against whatever
  # DATABASE_URL resolves to. In CI that must be this throwaway service container and
  # never a real database — the reason it is set explicitly here and not inherited.
  DATABASE_URL: 'postgresql://ship:ship_test_password@postgres:5432/ship_test'
  SESSION_SECRET: 'ci-only-not-a-real-secret'
  NODE_ENV: 'test'

# ---------------------------------------------------------------------------
# stage: setup
# ---------------------------------------------------------------------------

# Rule 5: compile once here. Later stages download this artifact rather than rebuilding,
# so what gets verified is byte-identical to what would be promoted.
build:
  stage: setup
  script:
    - pnpm build:shared
    - pnpm build
    - echo "$CI_COMMIT_SHA" > dist-sha.txt
    - echo "Built $CI_COMMIT_SHA on $(date -u +%FT%TZ)"
  artifacts:
    name: 'ship-$CI_COMMIT_SHORT_SHA'
    expire_in: 1 week
    paths:
      - shared/dist/
      - api/dist/
      - web/dist/
      - dist-sha.txt

# ---------------------------------------------------------------------------
# stage: verify — these four run in parallel
# ---------------------------------------------------------------------------

lint:
  stage: verify
  needs: ['build']
  script:
    # eslint.config.js is tuned so the current tree passes with zero errors; warnings
    # are debt owned by named improvement lanes. --max-warnings is deliberately not set
    # to 0 yet, because that would block on debt this change is not fixing.
    - pnpm lint
    # Captured separately so the warning count is reviewable without re-running. `|| true`
    # because this line is for the record — the gate is the `pnpm lint` above.
    - pnpm exec eslint . --format stylish > eslint-report.txt 2>&1 || true
    - tail -3 eslint-report.txt
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - eslint-report.txt
  allow_failure: false

type-check:
  stage: verify
  needs: ['build']
  script:
    - pnpm type-check

test:
  stage: verify
  needs: ['build']
  services:
    - name: postgres:16
      alias: postgres
  script:
    # `pnpm test` is api-only. Both suites run here, because Rule 2 ("tests must still
    # pass") is not satisfied by a green api run while 151 web tests sit unexecuted.
    - pnpm --filter @ship/api exec tsx src/db/migrate.ts
    - pnpm --filter @ship/api exec vitest run --reporter=default --reporter=junit --outputFile.junit=junit.xml
    - pnpm --filter @ship/web exec vitest run --reporter=default --reporter=junit --outputFile.junit=junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - api/junit.xml
      - web/junit.xml
    reports:
      junit:
        - api/junit.xml
        - web/junit.xml

coverage:
  stage: verify
  needs: ['build']
  services:
    - name: postgres:16
      alias: postgres
  script:
    - pnpm --filter @ship/api exec tsx src/db/migrate.ts
    - pnpm --filter @ship/api test:coverage
    # web needs --coverage.reportOnFailure explicitly; vitest defaults it to false, so
    # a failing run would otherwise emit no coverage at all.
    - pnpm --filter @ship/web test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - api/coverage/
      - web/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: api/coverage/cobertura-coverage.xml

# ---------------------------------------------------------------------------
# stage: audit
# ---------------------------------------------------------------------------

dependency-audit:
  stage: audit
  needs: []
  script:
    # Gate: zero critical advisories. This was 3 before the pnpm.overrides in
    # package.json pinned fast-xml-parser >=5.3.5, protobufjs >=7.5.5, vitest >=4.1.0.
    - pnpm audit --audit-level critical
    # High and moderate are recorded but not gated. Rule 4 permits a documented
    # deviation; the justification is in CHANGES.md — 51 high advisories are transitive
    # dev-tooling ReDoS reports with no patched path today, and gating on them would
    # block every merge for reasons unrelated to the change under review.
    - pnpm audit --json > pnpm-audit.json || true
    - node scripts/audit-summary.mjs
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - pnpm-audit.json
      - audit-summary.md

security-scan:
  stage: audit
  needs: []
  script:
    # Secret scanning. `comply` is the organisation's tool but is not installable in
    # this image, so gitleaks is used and the substitution is recorded in CHANGES.md.
    - apt-get update -qq && apt-get install -y -qq wget
    - wget -qO /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
    - tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
    - /tmp/gitleaks detect --source . --redact --report-path gitleaks-report.json --exit-code 1
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - gitleaks-report.json

license-inventory:
  stage: audit
  needs: []
  script:
    # Rule 4: "a list of all packages, their versions, and their license."
    - pnpm licenses list --json > licenses.json
    - node scripts/license-inventory.mjs
  artifacts:
    expire_in: 1 month
    paths:
      - licenses.md
      - licenses.csv
      - licenses.json

# ---------------------------------------------------------------------------
# stage: package
# ---------------------------------------------------------------------------

# Rule 5: one image, tagged with the commit SHA, promoted between environments rather
# than rebuilt per environment. It consumes the compiled output from `build` — it does
# not compile again.
docker-image:
  stage: package
  needs: ['build', 'lint', 'type-check', 'test']
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker info
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - echo "Built $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - |
      if [ -n "$CI_REGISTRY_USER" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        docker push "$CI_REGISTRY_IMAGE:latest"
      else
        echo "No registry credentials set — image built and verified, not pushed."
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
