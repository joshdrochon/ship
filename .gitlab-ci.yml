# GitLab CI — the primary pipeline.
#
# Implementation Rule 4 (brief p.8) requires build, lint, type-check, test, coverage,
# dependency audit (pnpm audit), security scan, and a source-code inventory, running on
# every commit and merge request, all passing before a merge.
#
# Rule 4 names GitHub Actions; the submission target on p.10 is a GitLab repository, and
# this fork's `origin` is GitLab. Both are satisfied rather than one being traded away:
# this file is the gate that actually blocks merges, and .github/workflows/ci.yml mirrors
# the same eight checks so the rule is met literally on the platform it names. If the two
# ever disagree, this file wins — it is the one attached to the submitted repository.
#
# Rule 5 (build/release/run separation) is why `build` runs once, early, and every later
# job consumes its artifact instead of recompiling. The artifact carries the commit SHA.

# One pipeline per commit, and it is the branch pipeline.
#
# Without this, opening a merge request creates a second, *merge request* pipeline
# alongside the branch one. Every job in this file uses the default `only:
# [branches, tags]`, which does not match `merge_request_event` — so that second
# pipeline is created with zero jobs, and GitLab marks a jobless pipeline as failed.
# Observed directly: MR !1's head pipeline (17395) failed with no jobs while the branch
# pipeline for the identical SHA (17387) was green on all eight.
#
# That matters beyond tidiness because `only_allow_merge_if_pipeline_succeeds` gates on
# the MR's head pipeline. A phantom failure would have blocked every merge in the project
# while the real checks passed.
#
# Two ways to fix it: give all eight jobs `rules` that match merge_request_event, or stop
# creating the duplicate. The second is chosen — the branch pipeline already runs every
# check against the exact SHA being merged, so an MR pipeline would re-run identical work
# for no additional signal, and Rule 5 (build once, promote) argues against duplicating a
# build per pipeline source.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - setup
  - verify
  - audit
  - package

default:
  image: node:22-bookworm
  interruptible: true
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.27.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    # Keyed on the lockfile so a dependency change invalidates it and nothing else does.
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

variables:
  # Rule 4 also requires pinned dependencies and a committed lockfile. --frozen-lockfile
  # above turns a drifted lockfile into a pipeline failure rather than a silent install.
  PNPM_VERSION: '10.27.0'
  POSTGRES_DB: ship_test
  POSTGRES_USER: ship
  POSTGRES_PASSWORD: ship_test_password
  # api/src/test/setup.ts truncates 15 tables in a beforeAll against whatever
  # DATABASE_URL resolves to. In CI that must be this throwaway service container and
  # never a real database — the reason it is set explicitly here and not inherited.
  DATABASE_URL: 'postgresql://ship:ship_test_password@postgres:5432/ship_test'
  SESSION_SECRET: 'ci-only-not-a-real-secret'
  NODE_ENV: 'test'

# ---------------------------------------------------------------------------
# stage: setup
# ---------------------------------------------------------------------------

# Rule 5: compile once here. Later stages download this artifact rather than rebuilding,
# so what gets verified is byte-identical to what would be promoted.
build:
  stage: setup
  script:
    - pnpm build:shared
    - pnpm build
    - echo "$CI_COMMIT_SHA" > dist-sha.txt
    - echo "Built $CI_COMMIT_SHA on $(date -u +%FT%TZ)"
  artifacts:
    name: 'ship-$CI_COMMIT_SHORT_SHA'
    expire_in: 1 week
    paths:
      - shared/dist/
      - agent/dist/
      - api/dist/
      - web/dist/
      - sdk/dist/
      - dist-sha.txt

# ---------------------------------------------------------------------------
# stage: verify — these four run in parallel
# ---------------------------------------------------------------------------

lint:
  stage: verify
  needs: ['build']
  script:
    # eslint.config.js is tuned so the current tree passes with zero errors; warnings
    # are debt owned by named improvement lanes. --max-warnings is deliberately not set
    # to 0 yet, because that would block on debt this change is not fixing.
    - pnpm lint
    # Captured separately so the warning count is reviewable without re-running. `|| true`
    # because this line is for the record — the gate is the `pnpm lint` above.
    - pnpm exec eslint . --format stylish > eslint-report.txt 2>&1 || true
    - tail -3 eslint-report.txt
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - eslint-report.txt
  allow_failure: false

# PF-013 — the public/internal boundary, enforced by the pipeline rather than by
# review. PRD Build Strategy §2 (p.10) asks for the rule "before you have any
# cross-imports to lint"; this is the job that makes the rule mean something.
#
# Blocking (allow_failure: false, the default here, stated anyway because it is the
# whole point of the ticket) and `needs: []` so it starts immediately and reports in
# under a minute. A boundary violation is a design error and the cheapest moment to
# see it is before the 150-minute e2e job has begun.
#
# Two commands, two different claims:
#   pnpm lint            — the tree has no violations today (also run by `lint`)
#   pnpm lint:boundary   — the rules that would catch one are still wired up
# The second exists because a mis-globbed `files` entry or a later config object
# overriding no-restricted-imports leaves the first green. See
# scripts/check-boundary-lint.mjs.
boundary-lint:
  stage: verify
  needs: []
  script:
    - pnpm lint:boundary
  allow_failure: false

type-check:
  stage: verify
  needs: ['build']
  script:
    - pnpm type-check

# `pnpm type-check` proves the code compiles. It does NOT observe how much of that
# compilation was bought with `any`, `as` and `!`, which is what Category 1 is measured
# on. Those are two different questions, and the second one has already gone wrong here:
# the target was met, then silently lost at 758 when another lane's test mocks added 17
# `as any` -- with type-check, lint, build and 553 unit tests all green.
#
# `needs: []` so this starts immediately rather than waiting on build. It reads source
# text; it does not need a compiled tree. python3 is 3.11.2 in node:22-bookworm.
type-violations:
  stage: verify
  needs: []
  script:
    - scripts/check-type-violations.sh
  allow_failure: false

# The only job here that leaves the runner. Every other one can be wrong about the
# outside world and still pass: `SUBMISSION.md` named a Render service deleted during
# the lane-8 teardown, and build, types, tests and the Terraform checks stayed green
# for the whole window in which the first link in the submission returned 404.
#
# `allow_failure: false` despite the network dependency, because the script already
# draws the distinction that matters: a 404 is the server saying the thing is gone and
# fails; an unreachable host warns and is counted. Flaky wifi cannot turn this red.
doc-links:
  stage: verify
  needs: []
  script:
    - scripts/check-doc-links.sh
  allow_failure: false

# L01 PF-028 — the ticket boards are a graded artifact, so a malformed one fails a PR.
#
# PRD p.12 grades the PR description against the acceptance criterion each slice
# advances, and every criterion lives on a lane board. A board that does not parse
# is a board nobody can check a PR against. This ran by hand for weeks and drifted:
# one row carried an unescaped pipe, split into seven columns, and the validator had
# been reporting that error to nobody.
#
# It also reports traceability — which MVP gate items, Testing Scenarios, Core
# Technical Requirement rows, performance targets and submission deliverables have
# no ticket claiming them (PF-027). Coverage gaps are printed, not failed: lanes land
# in waves and an unclaimed row mid-build is expected. Structural errors fail.
#
# `needs: []` and no build — it is Python over markdown.
ticket-boards:
  stage: verify
  needs: []
  script:
    - python3 scripts/check-plugforge-tickets.py
  allow_failure: false

# L13 PF-369 / PF-377 — the committed public spec cannot go stale, and drift FAILS.
#
# `docs/openapi.json` is a Submission Requirement (p.13) and is what a grader reads
# when the deployment is not reachable. It is generated, so it can silently fall
# behind the routes: add an endpoint, forget to regenerate, and the artifact ships
# describing an API that no longer exists. This job regenerates and diffs.
#
# **Decision (PF-377): fail, not warn, and no additive carve-out.** Pre-Search 3.3
# (p.18) asks whether additive changes should be exempt. They are not: a new route
# with no spec entry fails like any other drift, because "it's only additive" is how
# every drift starts, and an additive-only policy would let a resource land before
# its spec entry and keep CI green for exactly one commit. p.4 already requires drift
# to fail CI for the SDK-side test; this is the same posture one lane earlier.
#
# The spec↔route PARITY half is not here — it runs inside the `test` job as
# `platform/openapi/specParity.test.ts`, so it gates every PR through the same
# required check as everything else rather than through a job someone can retry.
#
# `needs: []` so it starts immediately: it runs tsx over source and needs no build.
openapi-freshness:
  stage: verify
  needs: []
  script:
    - pnpm openapi:public
    - |
      git diff --exit-code docs/openapi.json || {
        echo ''
        echo 'docs/openapi.json is STALE — the committed public spec does not match the'
        echo 'routes on this branch. Fix it with:'
        echo ''
        echo '    pnpm openapi:public && git add docs/openapi.json'
        echo ''
        echo 'Do not hand-edit the file: it is generated from the declareV1Route() calls'
        echo 'beside the handlers (PRD p.11), and a hand-edit is undone by the next run.'
        exit 1
      }
  allow_failure: false

# L26 PF-804 — MVP gate item 9's enforcement half.
#
# PRD p.2 item 9: "Existing Playwright regression suite passes on main; P95 latency,
# bundle size, and per-route query counts within +10% of the Part 1 baseline." p.6
# restates the budget. p.18's Pre-Search question asks how it will be enforced —
# "manual benchmark, automated baseline comparison, perf job that fails the PR?" —
# and this job is the third answer. `compare-baseline.ts` exits non-zero over budget,
# so there is no output to parse and no way to be over budget and green.
#
# `needs: ['build']` for web/dist: the bundle figure is measured off the built
# assets, and PF-802 rejects a comparison with no bundle number rather than skipping
# that third of the gate.
#
# ── Why latency is advisory here and enforced elsewhere ────────────────────────
# Bundle bytes and query counts are deterministic: same tree, same numbers, any
# machine. An in-process P95 is not. The baseline was captured on darwin-arm64 /
# node v26 / 10 cores; this runner is linux-x64 / node 22 / whatever the shared
# fleet gives it. Comparing those measures the runner, in BOTH directions — it can
# hide a real regression behind a faster box as easily as invent one on a slower
# box, and a perf job that goes red for reasons unrelated to the diff gets disabled
# within a week. So the comparator reads the baseline's environment fingerprint,
# marks latency advisory when it does not match, and keeps the two deterministic
# metrics enforced. The latency half is enforced on a machine matching the baseline
# and recorded in docs/mvp-gate-item-9.md. This is a deliberate split, not a gap:
# the report names it in the artifact every run.
regression-budget:
  stage: verify
  needs: ['build']
  services:
    - name: postgres:16
      alias: postgres
  script:
    - pnpm --filter @ship/api exec tsx src/db/migrate.ts
    # PF-807 — the instrument is judged before the tree is.
    #
    # A/A first: measure the same tree twice in separate processes and compare
    # it to itself. If the runner's own noise is larger than the +10% budget,
    # the comparison below cannot tell a regression from a scheduler hiccup and
    # this job stops here rather than reporting a verdict it did not earn.
    #
    # This is the check whose absence cost the MVP. The evidence that failed
    # review reported GET /health -- no query, no database -- as +32%, and once
    # as +108%. A route that does nothing cannot regress, and one A/A run says
    # so. See docs/measurement-rules.md.
    #
    # Both sides pin the rate limiter: Part 1 caps its test ceiling at 10_000/min
    # and this tree at 1_000_000, and above a certain sample count the Part 1
    # side answers 429 and the harness measures the error path as route latency.
    - API_RATE_LIMIT_MAX=100000000 PERF_TRIALS=25 node scripts/perf-self-check.mjs --budget 10
    - API_RATE_LIMIT_MAX=100000000 PERF_TRIALS=25 pnpm baseline:compare
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - docs/regression-report.md
      - docs/regression-report.json
  allow_failure: false

test:
  stage: verify
  needs: ['build']
  services:
    - name: postgres:16
      alias: postgres
  script:
    # PF-294's fitness test diffs the current tree against `pf/integration` to prove
    # adding a resource needed no generator edit. GitLab clones shallow and fetches
    # only the ref the pipeline runs on, so that branch is absent here and the test
    # died with `fatal: bad revision` — an infrastructure detail surfacing as a
    # fitness violation. `|| true` because on `pf/integration` itself the ref is
    # already checked out and this fetch is a no-op that must not fail the job.
    - git fetch --no-tags --depth=1 origin +refs/heads/pf/integration:refs/remotes/origin/pf/integration || true
    # `pnpm test` is api-only. Both suites run here, because Rule 2 ("tests must still
    # pass") is not satisfied by a green api run while 151 web tests sit unexecuted.
    - pnpm --filter @ship/api exec tsx src/db/migrate.ts
    - pnpm --filter @ship/api exec vitest run --reporter=default --reporter=junit --outputFile.junit=junit.xml
    - pnpm --filter @ship/web exec vitest run --reporter=default --reporter=junit --outputFile.junit=junit.xml
    # F24 — @ship/sdk had no CI step of any kind, which made it the one package a
    # stranger installs and the only one nothing verified. --passWithNoTests because
    # the SDK's own suites arrive with L17/L18; the step exists now so they cannot
    # land unrun.
    - pnpm --filter @ship/sdk test
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - api/junit.xml
      - web/junit.xml
    reports:
      junit:
        - api/junit.xml
        - web/junit.xml

# FG-247 / FG-248 / FG-235 — the agent package's own gate.
#
# Separate from `test` because the agent suite provisions its own Postgres per spec
# file with testcontainers and never reads DATABASE_URL. Running it inside `test` would
# put it in a job whose env points at a service container it ignores.
#
# `needs: ['build']` for api/dist: agent/src/actions/client.ts imports the circuit
# breaker from there on purpose, so the agent reuses api/src/services/circuitBreaker.ts
# instead of growing a second one (engineering requirement 4).
#
# ── This was allow_failure, and is not any more ────────────────────────────────────
# The reason it was: 11 of the 19 agent spec files start a `postgres:16` container via
# testcontainers, which needs a Docker daemon reachable from the job. The note here
# used to say that meant docker-in-docker, and that dind was unavailable because this
# runner sets `privileged = false`.
#
# The conclusion was right and the reason was wrong, which is why it went unfixed. A
# daemon does not require privileged mode — it requires a socket, and this runner has
# mounted one the whole time:
#
#   [runners.docker]
#   volumes = ["/var/run/docker.sock:/var/run/docker.sock", "/cache"]
#
# What actually failed was the dind SERVICE, which never attached to the job's network
# (see the block on the job below). Removing it and talking to the mounted daemon
# directly took the suite from 10 of 20 spec files dying in `beforeAll` to:
#
#   Test Files  20 passed (20)
#        Tests  174 passed (174)
#   assert-tests-ran: 174 tests executed (>= 162); command exit 0
#
# So this now gates a merge on both platforms, which is what the requirement asks for.
# The old note ended "if dind does turn out to work here, flip allow_failure to false".
# It was not dind, but the flip is the same.
agent-test:
  stage: verify
  needs: ['build']
  # ── Docker-outside-of-Docker, not dind ────────────────────────────────────────────
  # This job used to run a `docker:27-dind` service. On this project's runner that
  # never worked, and the job log said so twice on every run:
  #
  #   WARNING: Skipping alias "docker" for service "docker:27-dind": alias is
  #            already in use by another service
  #   WARNING: Possibly zombie container ...-docker-0-wait-for-service is
  #            disconnected from network bridge
  #
  # The dind service never attached to the job's network, so `tcp://docker:2375`
  # resolved to nothing, every testcontainer died in `beforeAll` at
  # `container.getConnectionUri()`, and 10 of 20 spec files failed at setup while 93
  # tests still passed — a shape that reads like a flaky suite and is not one.
  #
  # dind was never needed. The runner already mounts the host daemon:
  #
  #   [runners.docker]
  #   volumes = ["/var/run/docker.sock:/var/run/docker.sock", "/cache"]
  #
  # so the job can talk to the Mac's Docker directly. Containers it starts are
  # siblings rather than children, which is why the host override changes: they
  # publish on the Docker host, reachable from here as `host.docker.internal`.
  variables:
    TESTCONTAINERS_HOST_OVERRIDE: 'host.docker.internal'
    # Ryuk is testcontainers' reaper sidecar and it binds back to the client. Under
    # DooD that means binding back into this job's container, which the sibling has
    # no route to. The job is ephemeral and the runner reaps its own containers, so
    # the reaper has nothing to do here either way.
    TESTCONTAINERS_RYUK_DISABLED: 'true'
  script:
    # The expected minimum is the whole suite. A vitest path typo or a crashed worker
    # exits 0 having run nothing, and that reads as a pass in a summary line. Exit 2 —
    # VOID RUN — is deliberately distinct from a test failure. Raise the number when
    # tests are added.
    - scripts/assert-tests-ran.sh 162 -- pnpm --filter @ship/agent exec vitest run --reporter=default --reporter=junit --outputFile.junit=junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - agent/junit.xml
    reports:
      junit:
        - agent/junit.xml
  allow_failure: false

# PF-608 — the Time-to-First-Event drill, blocking, on every branch pipeline.
#
# p.6: "Drill runs in CI on every PR." p.11: "Time-to-first-event drill in CI from Day 5
# onward." p.13 makes a green run of THIS job Epic 6's proof artifact, so a local pass is
# not the deliverable — this is.
#
# Three repo-specific constraints, each of which has already broken a job in this file:
#
#  (a) `workflow.rules` above sets `merge_request_event -> when: never`. "Every PR" is
#      therefore served by the BRANCH pipeline for the same SHA, deliberately (see the
#      block at the top). Giving this job MR-only rules would mean it never executes.
#
#  (b) Testcontainers, not dind — copied from `agent-test` for the reason recorded there:
#      the `docker:27-dind` service never attached to this runner's job network and killed
#      10 of 20 spec files in `beforeAll`. The runner mounts the host socket, so containers
#      this job starts are SIBLINGS and publish on the Docker host.
#
#      That reasoning was right and the job still never ran. Every pipeline from 19893 to
#      20223 — 35 of them, unbroken since this job landed — exited 127 on a `docker pull
#      postgres:16` line that used to sit below, three lines before `pnpm drill ttfe`:
#
#          $ docker pull postgres:16
#          /usr/bin/bash: line 196: docker: command not found
#
#      The mounted socket is real; the `docker` CLI is not. `node:22-bookworm` ships no
#      docker binary, and testcontainers never wanted one — it speaks the Engine API over
#      /var/run/docker.sock through dockerode. `agent-test` sits ten lines above with the
#      same image, the same two TESTCONTAINERS_ vars and no CLI call, and starts a Postgres
#      per spec file across 24 files without complaint (job 65909, 228 tests, 36.9 s).
#
#      So the pre-pull is deleted rather than replaced. Nothing else needed changing: no
#      dind service, no `postgres:16` service container, and no touching PF-587's refusal.
#      The image pull now happens inside `provisionContainer()`, which runs in `beforeAll`
#      and is recorded as `setupMs` — outside the total p.8 grades, by the same rule that
#      already excludes the migrations and the server boot.
#
#  (c) `scripts/assert-tests-ran.sh 3 --` so a drill that executes zero stages exits 2 —
#      VOID RUN — rather than reading as a pass. Three is the whole drill file: the loop,
#      PF-602's benchmark link, and PF-611's CLI path.
#
# `pnpm drill ttfe` is the invocation p.6 names literally, and it is what runs here. No
# retry wrapper, ever: p.9's target is 0% flake and a retry is the mechanism that converts
# a flake into a pass (PF-605).
ttfe:
  stage: verify
  needs: ['build']
  variables:
    TESTCONTAINERS_HOST_OVERRIDE: 'host.docker.internal'
    TESTCONTAINERS_RYUK_DISABLED: 'true'
    # The harness provisions and DROPS a database. The pipeline-wide DATABASE_URL points
    # at the shared `postgres` service, and the harness refuses to adopt any inherited
    # URL by design (PF-587) — cleared here so the refusal is never the thing that fails
    # this job.
    DATABASE_URL: ''
  script:
    # The drill's own sources are checked by no other job: tsconfig.json excludes
    # `tests/`, and vitest strips types without checking them.
    - pnpm --filter @ship/cli exec tsc -p tsconfig.drill.json
    # PF-605 / PF-609: no sleeps, `retry: 0`, not a Playwright spec, one thresholds file.
    - node scripts/ttfe/check-fitness.mjs
    - scripts/assert-tests-ran.sh 3 -- pnpm drill ttfe
    # PF-600 / PF-603: the two gates no single run can produce. Reads the same
    # test-results/ttfe-series.jsonl the soak does.
    - node scripts/ttfe/check-series.mjs
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      # PF-592 / PF-610: the machine-readable artifact, next to junit.xml and
      # playwright-report/. Four consumers read this one file.
      - test-results/ttfe.json
      - test-results/ttfe-series.jsonl
  allow_failure: false

# PF-587 / PF-607 — the drill's negative controls, as their own job.
#
# Separate from `ttfe` because they boot two extra Ship instances and run the SDK suite:
# folding them into the same process would inflate the number p.8 grades. Blocking all the
# same — p.11 claims the drill "will catch contract regressions faster than any unit test",
# and until it has been seen failing for the right reason that claim has no evidence.
ttfe-controls:
  stage: verify
  needs: ['build']
  variables:
    TESTCONTAINERS_HOST_OVERRIDE: 'host.docker.internal'
    TESTCONTAINERS_RYUK_DISABLED: 'true'
    DATABASE_URL: ''
  script:
    # No `docker pull` here either — same reason as `ttfe` above: the socket is mounted,
    # the CLI is not, and testcontainers needs only the socket.
    - scripts/assert-tests-ran.sh 4 -- pnpm drill ttfe --controls
  allow_failure: false

# ── The nine integration commands (PF-720) ──────────────────────────────────────────
#
# `integrations/README.md` says: *"Every one of those runs in CI behind
# `scripts/assert-tests-ran.sh <n>`."* Before the four jobs below, this file ran ZERO of
# them. GitHub Actions had some; this file's own header calls itself authoritative on
# drift, and GitLab is the graded remote, so they only count here. p.8's headline asks for
# at least five integrations and this repo ships exactly five, with no margin — so nothing
# verified them on the remote that gets graded.
#
# Eight of the nine now run here. Counted against the README's own list:
#
#   @ship/cli test                  83  integration-units
#   @ship/cli test:server           19  cli-server-suite
#   @ship/slack test                19  integration-units
#   slack:live                      10  slack-live
#   @ship/browser-demo test          5  integration-units
#   @ship/browser-demo test:pkce     7  browser-demo-pkce
#   drill:refresh                   21  drill-refresh
#   drill:idempotency               14  drill-idempotency
#   @ship/integration-testkit test  21  integration-units
#
# Every count above was re-measured on THIS tree, after merging pf/integration. They are
# floors, not equalities (`assert-tests-ran.sh` compares with >=), but a stale floor
# under-guards: `@ship/cli test` was 58 and is 83, `@ship/slack test` was 17 and is 19,
# `slack:live` was 5 and is 10 — all three grew while this branch was open. Re-measure
# when they move rather than guessing upward.
#
# All nine run. `@ship/integration-testkit test` was the last, and it was held back for one
# pipeline for a reason worth recording: it was RED, and not environmentally. Its own
# PF-721 fitness test ("one listener, repository-wide") named two files outside the
# allow-list that bind a socket — `cli/tests/support/stubShip.ts` and
# `cli/tests/ttfe/listener.ts`. Both are deliberate (PF-599 needs the drill to own an
# `http.Server` it can read raw bytes off, and the p.11 fence stops `integrations/cli`
# importing the testkit at runtime anyway), so a job would have gone red on a real
# disagreement between three lanes rather than on a defect. L24 has since allow-listed
# both paths with reasons, and the suite passes 21/21 — so it has a job now.
#
# Every command below was run to completion on a worktree built with `pnpm install
# --frozen-lockfile` — CI's own install — before its job was written. That was not
# caution: SEVEN of them were broken, all by one bug, and a job added on faith would have
# landed red. `tsx` is a devDependency of `api`, so pnpm links it into
# `api/node_modules/.bin` and not into the workspace root; every `npx tsx` and every bare
# `tsx` in a root script therefore resolved nothing on a clean checkout. Five spawn sites
# and three `package.json` scripts were fixed in the same pass (PF-608).

# The CLI's server-backed suite — the only thing that runs the real `ship` binary against
# a real booted Ship.
#
# Two things had to be true before this job could exist, and neither was:
#
#  (a) `tests/server/support/harness.ts` spawned `npx tsx scripts/l19-device-approve.ts`.
#      `tsx` is a devDependency of `api`, so a clean `--frozen-lockfile` checkout has no
#      `tsx` at the workspace root and every test that logs in died with
#      `approval subprocess failed (127): sh: tsx: command not found`. Same root cause as
#      the TTFE drill's, found the same way, fixed the same way (PF-608).
#
#  (b) `OAUTH_RATE_LIMIT_PER_MINUTE` defaults to 30 per client IP (deps.ts, finding F29).
#      Nineteen tests that each complete a device grant blow through that, and the run
#      fails with `slow_down` — a failure about the harness, not about the CLI. Raised
#      here on the throwaway server this job boots, exactly as `browser-demo`'s own
#      playwright.config.ts sets `E2E_TEST: '1'` to lift the login limiter for the same
#      reason. It changes no assertion in the suite; the suite tests the CLI.
#
# The boot sequence is the one `integrations/cli/README.md` documents, not an invention —
# migrate, seed, build the binary, start `api/src/index.ts`, wait for `/health`. The wait
# is a bounded poll rather than a sleep: a fixed sleep is either too short on a loaded
# runner or wasted on an idle one, and it fails as a timeout that names nothing.
cli-server-suite:
  stage: verify
  needs: ['build']
  services:
    - name: postgres:16
      alias: postgres
  variables:
    SHIP_TEST_BASE_URL: 'http://127.0.0.1:3919'
    # See (b). Throwaway server, one job, no traffic but this suite's.
    OAUTH_RATE_LIMIT_PER_MINUTE: '100000'
  script:
    # Generated per job rather than written down: a literal here would be a committed
    # secret-shaped string for no benefit. `secretCipher.ts` wants base64 of 32 bytes.
    - export WEBHOOK_SECRET_KEY="$(head -c 32 /dev/urandom | base64)"
    # PF-057's three platform apps — including `ship_app_grader_demo`, the app every
    # device login below authenticates as — are seeded ONLY when these are set.
    # Measured on jobs 67101 and 67104: without them `oauth_apps` is EMPTY after a
    # migrate + seed, and every `ship login` answers
    # `Requesting a device code failed (invalid_client)`. The suite then reports a
    # perfectly explicable auth failure that is really a missing row. Throwaway values on
    # a throwaway database, generated per job so nothing secret-shaped is committed; the
    # TTFE harness does the same thing for the same reason.
    - export AGENT_CLIENT_SECRET="$(head -c 16 /dev/urandom | base64)"
    - export GRADER_CLIENT_SECRET="$(head -c 16 /dev/urandom | base64)"
    - export DEMO_CLIENT_SECRET="$(head -c 16 /dev/urandom | base64)"
    - pnpm --filter @ship/api exec tsx src/db/migrate.ts
    - pnpm db:seed
    # `dist/index.js` is what the suite spawns — it drives the built binary, never a
    # command function, so the build is part of what this job proves.
    - pnpm --filter @ship/cli build
    - |
      set -eu
      # PF-575's opt-in: `ship webhooks tail` subscribes a loopback target_url, which the
      # deployed instance refuses by default and must keep refusing.
      PORT=3919 \
      APP_BASE_URL="$SHIP_TEST_BASE_URL" \
      SHIP_ALLOW_LOOPBACK_WEBHOOK_TARGETS=true \
      NODE_ENV=development \
        api/node_modules/.bin/tsx api/src/index.ts > ship-server.log 2>&1 &
      echo "$!" > ship-server.pid
    - |
      set -eu
      deadline=$(( $(date +%s) + 120 ))
      until curl -sf "$SHIP_TEST_BASE_URL/health" > /dev/null; do
        if ! kill -0 "$(cat ship-server.pid)" 2>/dev/null; then
          echo "the Ship this job booted exited before answering /health:" >&2
          cat ship-server.log >&2
          exit 1
        fi
        if [ "$(date +%s)" -gt "$deadline" ]; then
          echo "no answer from $SHIP_TEST_BASE_URL/health within 120 s:" >&2
          cat ship-server.log >&2
          exit 1
        fi
        sleep 1
      done
      echo "ship up at $SHIP_TEST_BASE_URL"
    # 19 is the whole suite: story 11, deviceScenario 4, readmeSetup 2, tailModes 2.
    # Counted from the files, so a spec that stops being collected exits 2 rather than
    # reading as a pass.
    - scripts/assert-tests-ran.sh 19 -- pnpm --filter @ship/cli test:server
  after_script:
    - test -f ship-server.pid && kill "$(cat ship-server.pid)" 2>/dev/null || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ship-server.log
  allow_failure: false

# Authorization Code + PKCE, driven through a real Chromium against a real Ship.
#
# This is the only automated proof of that flow in a browser, and p.5's Testing Scenario 2
# rests on it. `integrations/browser-demo/playwright.config.ts` already does the hard part:
# it boots `api/src/index.ts` and `vite preview` as its own `webServer`s and registers the
# public OAuth app in `globalSetup`. So all this job supplies is a database with the seed
# user in it — `dev@ship.local`, whom the consent screen signs in as.
#
# `retries: 0` in that config, not the root's `process.env.CI ? 2 : 1`. Nothing here
# overrides it, for the reason the drill does not either.
#
# Chromium is installed rather than baked in via a Playwright image, matching `e2e`: the
# image tag would have to track @playwright/test by hand and a mismatch fails at runtime.
browser-demo-pkce:
  stage: verify
  needs: ['build']
  services:
    - name: postgres:16
      alias: postgres
  variables:
    # Not the config's 3124 default — nothing else in this job uses that port, but pinning
    # it here keeps the number visible next to the job that depends on it. DEMO_PORT is
    # NOT settable: `scripts/l24-browser-demo-setup.ts` registers the redirect URI as the
    # constant `http://localhost:4173/` and vite inlines it at build time, so the two
    # would drift into an `invalid_grant` nobody could read.
    DEMO_API_PORT: '3124'
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.27.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm exec playwright install --with-deps chromium
  script:
    - export WEBHOOK_SECRET_KEY="$(head -c 32 /dev/urandom | base64)"
    - pnpm --filter @ship/api exec tsx src/db/migrate.ts
    # For `dev@ship.local` / `admin123`. globalSetup fails by name without that user.
    - pnpm db:seed
    # 7 is the whole spec file: 4 for PF-734, 1 for PF-735's negative case, 2 for PF-736.
    - scripts/assert-tests-ran.sh 7 -- pnpm --filter @ship/browser-demo test:pkce
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - integrations/browser-demo/test-results/
  allow_failure: false

# The three integration suites that need nothing but a checkout — no database, no server,
# no browser. Grouped into one job because this project's runner is a laptop with
# `concurrent = 4`, and three jobs whose combined runtime is under a minute would spend
# more time waiting for a slot than running.
#
# Each is wrapped separately, so the trace names which one shrank rather than reporting a
# single merged count that no longer maps to a suite.
integration-units:
  stage: verify
  needs: ['build']
  script:
    # `build` publishes shared/agent/api/web/sdk dist and nothing under integrations/.
    # `@ship/slack`'s listener test imports `@ship/integration-testkit` at runtime, so
    # without this it dies at collection with "Failed to resolve entry for package
    # @ship/integration-testkit" and reports zero tests — which assert-tests-ran correctly
    # calls a SHORT RUN rather than a failure. Measured on job 67103.
    - pnpm --filter @ship/integration-testkit build
    - scripts/assert-tests-ran.sh 83 -- pnpm --filter @ship/cli test
    - scripts/assert-tests-ran.sh 19 -- pnpm --filter @ship/slack test
    - scripts/assert-tests-ran.sh 5 -- pnpm --filter @ship/browser-demo test
    # PF-721's own suite. It was red until L24 allow-listed the two files this repo
    # deliberately carries a second listener in — `cli/tests/support/stubShip.ts` and
    # `cli/tests/ttfe/listener.ts` — so it had no job on the older tree. It passes now,
    # which is the last of the nine.
    - scripts/assert-tests-ran.sh 21 -- pnpm --filter @ship/integration-testkit test
  allow_failure: false

# The three commands that boot a Ship through `scripts/l24-drill-server.ts` — it
# provisions the instance, exports SHIP_DRILL_BASE_URL / SHIP_DRILL_CLIENT_ID, runs the
# package's suite, and tears the instance down.
#
# THREE JOBS, NOT ONE, AND THAT COST A PIPELINE TO LEARN. Run back to back against a
# single database (job 67104) the second drill fails with
#
#   [webhooks] could not resolve subscriptions for document.created … NOTHING was
#   delivered … WebhookSecretCryptoError: Webhook signing secret failed to decrypt
#
# because each drill leaves its subscriptions behind and a signing secret is encrypted at
# rest under WEBHOOK_SECRET_KEY. Seeding does not truncate them, so drill two inherits
# drill one's rows. Ordering the lines "correctly" would hide that rather than fix it: it
# would leave a suite that passes only because of what ran before it, which is the shape
# of flake p.9 sets at zero. A job per drill means a `postgres:16` service container per
# drill, which is a genuinely fresh database and needs no extra machinery.
#
# `slack:live` is a misleading name and it cost a round trip to establish: it needs NO
# Slack credentials. "Live" means a live Ship — the suite drives a real webhook delivery
# into the Slack integration's own handler over a socket. `tests/live/**` is excluded from
# `@ship/slack test`'s default config, which is why it needs its own invocation.
#
# `drill:refresh` boots TWO instances (PF-727: the expired-token case comes from a second
# process with SHIP_REFRESH_TOKEN_TTL_SECONDS=0, never from waiting).
.drill-job: &drill-job
  stage: verify
  needs: ['build']
  services:
    - name: postgres:16
      alias: postgres
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.27.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - export WEBHOOK_SECRET_KEY="$(head -c 32 /dev/urandom | base64)"
    # PF-057's three platform apps — including `ship_app_grader_demo`, the app every
    # device login authenticates as — are seeded ONLY when these are set. Measured on
    # jobs 67101 and 67104: without them `oauth_apps` is EMPTY after migrate + seed and
    # every `ship login` answers `Requesting a device code failed (invalid_client)`, so
    # the suite reports a plausible auth failure that is really a missing row.
    # Throwaway values on a throwaway database, generated per job so nothing
    # secret-shaped is committed. The TTFE harness does the same, for the same reason.
    - export AGENT_CLIENT_SECRET="$(head -c 16 /dev/urandom | base64)"
    - export GRADER_CLIENT_SECRET="$(head -c 16 /dev/urandom | base64)"
    - export DEMO_CLIENT_SECRET="$(head -c 16 /dev/urandom | base64)"
    - pnpm --filter @ship/api exec tsx src/db/migrate.ts
    # For `dev@ship.local`, whom `scripts/l19-device-approve.ts` signs in as.
    - pnpm db:seed
  allow_failure: false

# Minimums are the whole suite in each case, counted from a run on a clean install.
drill-refresh:
  <<: *drill-job
  script:
    - scripts/assert-tests-ran.sh 21 -- pnpm drill:refresh

drill-idempotency:
  <<: *drill-job
  script:
    - scripts/assert-tests-ran.sh 14 -- pnpm drill:idempotency

slack-live:
  <<: *drill-job
  script:
    - scripts/assert-tests-ran.sh 10 -- pnpm slack:live

coverage:
  stage: verify
  needs: ['build']
  services:
    - name: postgres:16
      alias: postgres
  script:
    - pnpm --filter @ship/api exec tsx src/db/migrate.ts
    - pnpm --filter @ship/api test:coverage
    # web needs --coverage.reportOnFailure explicitly; vitest defaults it to false, so
    # a failing run would otherwise emit no coverage at all.
    - pnpm --filter @ship/web test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - api/coverage/
      - web/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: api/coverage/cobertura-coverage.xml

# E2E is a blocking gate, not an advisory one.
#
# It was previously local-only, so the 874 Playwright tests never ran against a merge.
# Everything the unit suites cannot see — the 4-panel layout, the collaboration socket,
# session expiry, the editor — was unguarded on every merge to main.
#
# It uses a plain `postgres` service rather than testcontainers.
#
# The suite provisions a database per worker. Locally that is a testcontainers instance,
# which needs a Docker daemon — and reaching one from inside a CI job means
# docker-in-docker, which means a runner willing to grant privileged mode. That made the
# gate a property of how one runner happens to be configured rather than of the commit,
# and the runner this project actually has sets `privileged = false`.
#
# `E2E_DATABASE_URL` switches e2e/fixtures/isolated-env.ts onto a database-per-worker on
# this service instead. Isolation is unchanged: no two workers share tables either way.
# Unset locally, so a developer's run still uses testcontainers and nothing about the
# local workflow changes.
#
# Connects to the `postgres` database, not `ship_test`: the fixture needs somewhere to
# issue CREATE DATABASE from, and POSTGRES_USER is the image's superuser.
e2e:
  stage: verify
  needs: ['build']
  services:
    - name: postgres:16
      alias: postgres
  # 150m, not the default. A job killed at the timeout reports as a failure
  # indistinguishable from a real one, so the headroom is deliberate.
  #
  # This once said "roughly 100 minutes for a clean run", extrapolated from 266 tests in
  # 30 minutes. The extrapolation was sound and the conclusion drawn from it was not:
  # it treated the whole suite as uniformly slow here. Three measured runs came in at
  # 78.9, 81.7 and 79.7 minutes, and attributing every progress line in job 61094 to its
  # spec file shows where that went:
  #
  #   file-attachments.spec.ts      39.7 min   39 attempts   61.2 s each
  #   images / performance /
  #   data-integrity / race-cond.   13.4 min
  #   the other 69 spec files      ~24   min  ~820 tests     ~1.8 s each
  #
  # 61.2 s is the 60 s test timeout in playwright.config.ts. The upload tests were not
  # running slowly, they were waiting for a `filechooser` event that never arrives on
  # this runner, three times over with CI retries. The other 820 tests run at ~1.8 s
  # each, which is FASTER per test than GitHub's runner manages -- this is a 10-core
  # arm64 laptop with no emulation, not a slow machine.
  #
  # `expectFileChooser` in e2e/fixtures/test-helpers.ts bounds that wait at 10 s. The
  # tests still fail; they stop costing 50 extra seconds each to do it.
  timeout: 150m
  variables:
    E2E_DATABASE_URL: 'postgresql://ship:ship_test_password@postgres:5432/postgres'
    # Pinned, not derived. playwright.config.ts otherwise picks the worker count from
    # free memory at launch — the same tree ran at 1 worker and at 10 within an hour on
    # one machine, the second leaving 47 tests unexecuted. A gate whose parallelism
    # depends on the runner's spare RAM cannot compare two commits.
    #
    # 1 here, 2 on GitHub. Not an oversight -- the two runners have different capacity and
    # the number is set to what each can actually carry.
    #
    # This project's GitLab runner is a container inside a 7.8 GB Docker VM on a laptop,
    # shared with everything else on that machine. Four workers were OOM-killed at test 510
    # of 874. Two workers left 1.3 GB free and produced 26 failures whose signature is
    # starvation rather than defect: 47 tests timed out in `waitForEvent`, and the browser
    # logged `Failed to fetch` 23 times because the API server it was talking to had stopped
    # answering. The same commit on GitHub's 16 GB runner failed one test.
    #
    # One worker roughly doubles wall clock -- 43.5 min at two, so expect ~85 -- which the
    # 150m timeout accommodates.
    PLAYWRIGHT_WORKERS: '1'
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.27.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    # Installed rather than baked in via a Playwright image: the image tag would have to
    # track @playwright/test by hand, and a mismatch between the bundled browser and the
    # client driving it fails at runtime rather than at install.
    - pnpm exec playwright install --with-deps chromium
  script:
    # The expected minimum is the whole suite. A crashed worker or a bad filter that
    # silently drops tests exits 2 instead of reading as a pass — the failure mode that
    # produced two "clean" 827-test runs during this work.
    - scripts/assert-tests-ran.sh 874 -- pnpm exec playwright test --reporter=line
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - playwright-report/
      - test-results/
  # Non-blocking HERE, and blocking on GitHub. The job still runs, still reports, and its
  # artifacts are still published — it just does not gate a merge on this runner.
  #
  # Why: 27 tests fail here that pass on GitHub. This comment has been wrong twice about
  # them and both corrections are worth keeping, because each wrong version pointed the
  # next investigation at the wrong layer.
  #
  # Wrong #1 -- "roughly five times slower per test". Compared worker-for-worker against
  # GitHub on the same commit, this runner is FASTER on every spec file measured. It is a
  # 10-core arm64 laptop running arm64 images natively; `uname -m` is arm64, Docker
  # reports aarch64, node:22-bookworm reports arm64, so there is no emulation either.
  #
  # Wrong #2 -- "27 tests whose file chooser never opens". It is 13, all of them in
  # file-attachments.spec.ts, all driven by the `/file` command. Counted directly: the
  # string `waiting for event "filechooser"` appears 39 times in job 61094 = 13 x 3
  # attempts. The other 14 DO get a chooser and fail afterwards, when the file never
  # reaches the editor. Two failure modes, merged into one number, so every theory had to
  # explain a symptom half of them did not have.
  #
  # The cause is in the APPLICATION, not in this file. `Editor.tsx` captured
  # `imageUploadAbortRef.current.signal` inside a useMemo; the collaboration effect swaps
  # that controller in its cleanup. React runs useMemo in the render phase and the
  # previous cleanup in the commit phase -- render first -- so the memo always held the
  # controller about to be aborted, and its deps do not change when the ref is swapped.
  # `/file` checks `signal?.aborted` BEFORE creating the input (no chooser at all);
  # `/image` clicks first and checks inside `reader.onload` (chooser opens, file dropped).
  # That asymmetry is exactly the observed split. Fixed by reading the signal at command
  # time -- see `getAbortSignal` in web/src/components/editor/SlashCommands.tsx.
  #
  # Ruled out by measurement, so nobody re-runs them: parallelism (4, 2 and 1 worker are
  # identical), memory (1 worker leaves headroom), job timeout (raised to 150m), browser
  # build (Chromium 143.0.7499.4, byte-identical on both platforms), and /dev/shm -- the
  # runner does give the job Docker's default 64 M, but a standalone probe in the same
  # image fired `filechooser` for sync clicks, post-`await import()` clicks and post-task
  # clicks. The user-activation theory is dead with it.
  #
  # STILL allow_failure: true, deliberately. The fix above is believed to be the cause but
  # has not yet been observed green on this runner, and flipping the gate on a belief is
  # how the two wrong claims above survived so long. Flip it after one clean run here.
  allow_failure: true

# ---------------------------------------------------------------------------
# stage: audit
# ---------------------------------------------------------------------------

# PF-624 — the Terraform gate. PRD p.5: "no unpinned versions permitted", and
# `terraform plan` must run cleanly.
#
# READ-ONLY BY CONSTRUCTION. This job runs `plan`, never `apply` and never
# `destroy`. Three things enforce that rather than one comment asking nicely:
#
#   1. `-lock=false` on the plan. A read-only job has no business taking the
#      state lock -- if it did, a CI run and an operator applying a hotfix would
#      contend, and the human would lose to a robot doing nothing.
#   2. The credential. `AWS_ACCESS_KEY_ID`/`AWS_SECRET_ACCESS_KEY` here MUST be
#      the `ship-ci-terraform-plan` identity carrying ReadOnlyAccess plus
#      s3:GetObject on the state object -- NOT the `ship-terraform` operator
#      identity, which holds AdministratorAccess. Named here on purpose so a
#      reviewer can check it against the account (docs/infra/aws-account.md).
#      A plan job holding admin is a plan job that can be edited into an apply job
#      in one line.
#   3. The pin audit runs FIRST and independently of credentials, so an unpinned
#      provider fails the pipeline even in a fork with no AWS access at all.
#
# `workflow.rules` sets `merge_request_event -> never` (finding F28), so this
# rides the BRANCH pipeline. An `if: $CI_MERGE_REQUEST_IID` rule would never fire.
#
# `allow_failure: false` on both halves: an unpinned version or a plan error
# fails the check, which is the whole point of the ticket.
terraform-verify:
  stage: verify
  needs: []
  image:
    name: hashicorp/terraform:1.15.8
    entrypoint: [""]
  before_script:
    - apk add --no-cache bash git aws-cli
  script:
    # (1) Pin audit. No credentials needed -- pure source inspection.
    - bash scripts/check-tf-pins.sh pin-audit.txt
    # (2) Plan. Skipped with a LOUD message rather than silently passing when the
    #     read-only credential is absent, so "no AWS configured" can never be
    #     mistaken for "the plan is clean".
    - |
      if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
        echo "=============================================================="
        echo "SKIPPING terraform plan: no AWS_ACCESS_KEY_ID in this pipeline."
        echo "The pin audit above still ran and still gates."
        echo "Set the ship-ci-terraform-plan credential to enable the plan half."
        echo "=============================================================="
        exit 0
      fi
      BUCKET=$(aws ssm get-parameter --name /ship/terraform-state-bucket --query Parameter.Value --output text)
      cd terraform
      terraform init -input=false -lockfile=readonly -backend-config="bucket=$BUCKET"
      terraform plan -input=false -no-color -lock=false
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - pin-audit.txt
  allow_failure: false

dependency-audit:
  stage: audit
  needs: []
  script:
    # Gate: zero critical advisories. This was 3 before the pnpm.overrides in
    # package.json pinned fast-xml-parser >=5.3.5, protobufjs >=7.5.5, vitest >=4.1.0.
    - pnpm audit --audit-level critical
    # High and moderate are recorded but not gated. Rule 4 permits a documented
    # deviation; the justification is in CHANGES.md — 51 high advisories are transitive
    # dev-tooling ReDoS reports with no patched path today, and gating on them would
    # block every merge for reasons unrelated to the change under review.
    - pnpm audit --json > pnpm-audit.json || true
    - node scripts/audit-summary.mjs
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - pnpm-audit.json
      - audit-summary.md

security-scan:
  stage: audit
  needs: []
  script:
    # Secret scanning. `comply` is the organisation's tool but is not installable in
    # this image, so gitleaks is used and the substitution is recorded in CHANGES.md.
    - apt-get update -qq && apt-get install -y -qq wget
    - wget -qO /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
    - tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
    - /tmp/gitleaks detect --source . --redact --report-path gitleaks-report.json --exit-code 1
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - gitleaks-report.json

license-inventory:
  stage: audit
  needs: []
  script:
    # Rule 4: "a list of all packages, their versions, and their license."
    - pnpm licenses list --json > licenses.json
    - node scripts/license-inventory.mjs
  artifacts:
    expire_in: 1 month
    paths:
      - licenses.md
      - licenses.csv
      - licenses.json

# ---------------------------------------------------------------------------
# stage: package
# ---------------------------------------------------------------------------

# Rule 5: one image, tagged with the commit SHA, promoted between environments rather
# than rebuilt per environment.
#
# This job VERIFIES the artifact. It does not publish it. .github/workflows/ci.yml
# does that, to ghcr.io, and terraform/render deploys the tag it pushes. The split is
# not a preference — this GitLab instance does not run a container registry:
#
#   $ curl 'https://labs.gauntletai.com/jwt/auth?service=container_registry'
#     {"errors":[{"code":"UNAVAILABLE","message":"registry not enabled"}]}   HTTP 404
#
#   GET /api/v4/projects/1609            → container_registry_image_prefix: null
#   GET /api/v4/projects/1609/registry/repositories → []
#
# `container_registry_access_level` reads `enabled` on the project, which is misleading:
# the project setting is on, the instance service is not deployed. So $CI_REGISTRY_IMAGE
# expands to the empty string here, and the previous version of this job ran
#
#   docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" ...
#     ERROR: invalid tag ":c43276832cabea468f88aaf511ccf816ed676965": invalid reference format
#
# which failed every main pipeline for five consecutive commits, up to and including
# HEAD c432768 — the other eight jobs were green, and this job only runs on main, so
# every lane and integration branch looked clean while the default branch was red.
# No credential fixes that; there is nothing to authenticate to.
#
# What this job does instead is the part that has value without a registry: build the
# real image from this commit and prove the commit SHA is inside it. The tag is local
# and always well-formed, so it cannot reproduce the failure above. Pushing to ghcr.io
# from here was considered and rejected — it would need a long-lived GitHub PAT stored
# as a masked CI variable, where GitHub Actions gets a scoped, job-lifetime token for
# free.
docker-image:
  stage: package
  needs: ['build', 'lint', 'type-check', 'test']
  image: docker:27
  services:
    - docker:27-dind
  variables:
    # Local-only tag. Never pushed, so the name just has to be a valid reference.
    IMAGE: 'ship:$CI_COMMIT_SHA'
  before_script:
    - docker info
  script:
    - docker build --build-arg "GIT_SHA=$CI_COMMIT_SHA" -t "$IMAGE" .
    - echo "Built $IMAGE"

    # Provenance gate — the check that would have caught finding F26. It asserts the
    # SHA reached the image metadata and the runtime environment, rather than trusting
    # that the --build-arg above was wired up correctly.
    - |
      set -eu
      label=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")
      echo "label org.opencontainers.image.revision = $label"
      test "$label" = "$CI_COMMIT_SHA" || { echo "expected $CI_COMMIT_SHA"; exit 1; }
    - |
      set -eu
      env_sha=$(docker inspect --format '{{ range .Config.Env }}{{ println . }}{{ end }}' "$IMAGE" | sed -n 's/^GIT_SHA=//p')
      echo "runtime env GIT_SHA = $env_sha"
      test "$env_sha" = "$CI_COMMIT_SHA" || { echo "expected $CI_COMMIT_SHA"; exit 1; }

    # And that it reaches the wire. The image's default CMD runs migrate and seed
    # against a database that does not exist in this job, so start the server directly:
    # api/src/app.ts answers /health before it issues any query, so no database is
    # needed. Both env vars are throwaway values that only satisfy boot-time checks.
    #
    # The request is made with `docker exec` from inside the container rather than by
    # publishing a port. Two reasons, and the first is a correctness bug this avoids:
    # under docker-in-docker the daemon is a separate service container, so a published
    # port lands on *that* host and `localhost:8080` from this job reaches nothing.
    # Second, the runtime image is node:20-slim, which ships neither curl nor wget —
    # but it does ship node, and node 20 has a global fetch.
    - |
      set -eu
      docker run -d --name ship-provenance \
        -e SESSION_SECRET=ci-only-not-a-real-secret \
        -e DATABASE_URL=postgres://unused:unused@127.0.0.1:5432/unused \
        "$IMAGE" node dist/index.js

      health=""
      i=0
      while [ $i -lt 30 ]; do
        if health=$(docker exec ship-provenance node -e \
             "fetch('http://127.0.0.1:80/health').then(r=>r.text()).then(t=>process.stdout.write(t))" 2>/dev/null); then
          break
        fi
        i=$((i + 1)); sleep 2
      done

      docker logs ship-provenance || true
      echo "GET /health -> $health"
      echo "$health" | grep -q "\"revision\":\"$CI_COMMIT_SHA\"" \
        || { echo "expected revision $CI_COMMIT_SHA"; exit 1; }
      docker rm -f ship-provenance
    - echo "Provenance verified. Published by .github/workflows/ci.yml as ghcr.io/joshdrochon/ship:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
